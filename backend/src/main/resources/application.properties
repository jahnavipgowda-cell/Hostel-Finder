# Application Configuration
spring.application.name=hostel-finder

# Server
server.port=8080
server.servlet.context-path=/api

# H2 Database (Development)
spring.datasource.url=jdbc:h2:mem:hostelfinderdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# --- PostgreSQL (Production - uncomment when deploying) ---
# spring.datasource.url=jdbc:postgresql://localhost:5432/hostelfinderdb
# spring.datasource.username=postgres
# spring.datasource.password=yourpassword
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# spring.jpa.hibernate.ddl-auto=update

# JWT Configuration
app.jwt.secret=HostelFinderSuperSecretKey2026PleaseChangeInProduction
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000

# Redis Cache (optional - comment out if not using Redis)
# spring.redis.host=localhost
# spring.redis.port=6379
spring.cache.type=simple

# File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
app.upload.dir=uploads

# Mail Configuration (configure for email notifications)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# CORS
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:5174

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
# Logging
logging.level.com.hostelfinder=DEBUG
logging.level.org.springframework.security=WARN

# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true
